services:
  - type: web
    name: chutki-backend
    env: node
    plan: free
    buildCommand: npm ci --omit=dev --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: DISABLE_AI_CHAT
        value: "true"
