services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: chutki
    volumes:
      - mongodb_data:/data/db
    networks:
      - chutki-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5001}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}@mongodb:27017/chutki?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DISABLE_AI_CHAT: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - chutki-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongodb_data:

networks:
  chutki-network:
    driver: bridge
